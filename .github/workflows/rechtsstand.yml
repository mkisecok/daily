name: Rechtsstand

# Weekly check whether the committed EU law texts (DSGVO, KI-VO) are still
# the versions in force (pnpm normen:check --eu-only). On a new or announced
# version it opens one issue, or comments on the open one, with the report
# and the tools that cite the law. A source that cannot be read gives a
# warning, no issue. It never imports or changes the data: legal content
# always gets a human review.
#
# BDSG and TDDDG are checked locally with pnpm normen:check: in November
# 2026 gesetze-im-internet.de refused GitHub-hosted runners on every try,
# over HTTPS and HTTP, and no other official source reachable from GitHub
# carries their Stand. The report says so on every run.

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rechtsstand
  cancel-in-progress: false

jobs:
  check:
    name: Law versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Compile messages
        run: pnpm i18n:compile

      # exit 1: a version in force changed, 2: a source could not be read
      - name: Check law versions
        id: check
        run: |
          set +e
          pnpm --silent normen:check --eu-only --out report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # an issue only for a new or announced version, not for a source that was down
          if [ ! -f report.md ] || ! grep -qE 'Neu in Kraft:|Angekündigt:' report.md; then
            echo "No new law version to report."
            exit 0
          fi
          title='Rechtsstand: neue Fassung prüfen'
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi

      # Cellar down: a warning on the run, not an issue
      - name: Warn when a source could not be read
        if: steps.check.outputs.status == '2'
        run: |
          grep 'Nicht geprüft' report.md | sed 's/^- //; s/\*\*//g' | while read -r line; do
            echo "::warning title=Rechtsstand::$line"
          done
