name: Checks

# Runs on every pull request what the Pages workflow runs before a deploy:
# messages, types, lint and unit tests, then the preview end-to-end tests
# against the static build. The two jobs report separately, so a branch rule
# can require both.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Compile messages
        run: pnpm i18n:compile

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm vitest run --project server

  e2e:
    name: Preview end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Compile messages
        run: pnpm i18n:compile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      # Builds under /daily and runs every *.preview.e2e.ts against it.
      - name: Preview end-to-end tests
        run: pnpm test:e2e:preview

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
