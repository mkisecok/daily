<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%" data-theme="%daily.theme%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// The server renders the theme from the cookie. Static pages cannot,
			// so read the cookie here first, then fall back to the OS preference.
			(function () {
				var root = document.documentElement;
				if (root.dataset.theme !== 'auto') return;
				var saved = document.cookie.match(/(?:^|;\s*)theme=(light|dark)/);
				root.dataset.theme = saved
					? saved[1]
					: matchMedia('(prefers-color-scheme: dark)').matches
						? 'dark'
						: 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
